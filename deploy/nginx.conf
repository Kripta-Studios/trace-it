# Only the local Caddy proxy can reach this loopback-bound gateway; it replaces X-Forwarded-For.
map $http_x_forwarded_for $trace_client {
    "" $binary_remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $trace_client zone=trace_login:1m rate=10r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    # Refresh Docker DNS when the API container is replaced, without restarting this gateway.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $trace_backend backend:8000;
    proxy_connect_timeout 3s;
    # Preserve errors returned by the API; only gateway failures use this fallback.
    proxy_intercept_errors off;
    error_page 502 504 =503 @maintenance;
    # The API authenticates browser sessions and service tokens.
    auth_basic off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Only reachable on the loopback listener/container network, outside Caddy's route.
    location = /internal-health {
        auth_basic off;
        proxy_pass http://$trace_backend/ready;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location = /nexia/trace-it { return 308 /nexia/trace-it/; }
    # Public API documentation.
    location ~ ^/nexia/trace-it/api/(docs|redoc|openapi\.json|guide|docs/oauth2-redirect)$ {
        auth_basic off;
        rewrite ^/nexia/trace-it/api/(.*)$ /$1 break;
        proxy_pass http://$trace_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /nexia/trace-it/api/login {
        limit_req zone=trace_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://$trace_backend/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 15s;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-store" always;
    }
    location /nexia/trace-it/api/ {
        # Password sessions protect business data; /db remains Bearer-only.
        rewrite ^/nexia/trace-it/api/(.*)$ /$1 break;
        proxy_pass http://$trace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
        proxy_buffering off;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-store" always;
    }
    location /nexia/trace-it/assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location /nexia/trace-it/ {
        try_files $uri /nexia/trace-it/index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-store";
    }
    location @maintenance {
        default_type application/json;
        add_header Retry-After 5 always;
        return 503 '{"code":"maintenance","message":"Servicio temporalmente no disponible. Vuelve a intentarlo en unos instantes."}';
    }
    location / { return 404; }
}
